name: Android PR gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: android-pr-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: sdkmanager 'platform-tools' 'platforms;android-35' 'build-tools;35.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Validate example rules
        run: python3 scripts/validate-rules.py config/rules.example.json

      - name: Unit tests, lint, and debug APK
        run: gradle --no-daemon --stacktrace testDebugUnitTest lintDebug assembleDebug

      - name: Create checksums and verification bundle
        run: |
          mkdir -p build/verified-artifact
          cp app/build/outputs/apk/debug/app-debug.apk build/verified-artifact/geo-reminder-debug.apk
          sha256sum build/verified-artifact/geo-reminder-debug.apk > build/verified-artifact/geo-reminder-debug.apk.sha256
          cp -R app/build/reports/tests build/verified-artifact/test-reports
          cp -R app/build/reports/lint-results-debug.html build/verified-artifact/lint-results-debug.html

      - name: Upload verified APK and reports
        uses: actions/upload-artifact@v4
        with:
          name: geo-reminder-debug-${{ github.sha }}
          path: build/verified-artifact
          if-no-files-found: error
          retention-days: 30

      - name: Mark pull request ready after successful verification
        if: github.event_name == 'pull_request' && github.event.pull_request.draft
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr ready "$PR_URL"
